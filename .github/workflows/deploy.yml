# Publishes the site to GitHub Pages. Run manually: Actions > Deploy site > Run workflow.
# Needs two repository variables: SITE_URL (https://yourdomain.com) and CUSTOM_DOMAIN (yourdomain.com).
name: Deploy site
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build static site
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CUSTOM_DOMAIN: ${{ vars.CUSTOM_DOMAIN }}
        run: |
          mkdir dist
          cp -r index.html privacy.html terms.html css js images dist/
          sed -i "s#__SITE_URL__#${SITE_URL%/}#g" dist/*.html
          if [ -n "$CUSTOM_DOMAIN" ]; then echo "$CUSTOM_DOMAIN" > dist/CNAME; fi
          touch dist/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
